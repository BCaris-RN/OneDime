#  (o) OneDime | render.yaml
#  ----------------------------------------------------------
#  Prepared configuration only. Brandon decides deployment.
services:
  - type: web
    name: onedime-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: onedime-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: SESSION_TTL_DAYS
        value: "14"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYOUTS_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: AI_MONTHLY_BUDGET_CENTS
        value: "100"
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DEMO_SEED_ENABLED
        value: "false"

databases:
  - name: onedime-db
    databaseName: onedime
    user: onedime
    plan: starter

