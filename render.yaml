services:
  - type: web
    name: onedime-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: onedime-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox

databases:
  - name: onedime-db
    databaseName: onedime
    user: onedime
    plan: starter

