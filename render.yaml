#  (o) OneDime | render.yaml
#  ----------------------------------------------------------
#  Render blueprint: web service and Postgres. Brandon deploys.
services:
  - type: web
    name: onedime-web
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: onedime-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: BETA_ALLOWLIST
        sync: false
      - key: SESSION_TTL_DAYS
        value: "14"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYOUTS_ENABLED
        value: "false"
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DEMO_SEED_ENABLED
        value: "false"

databases:
  - name: onedime-db
    postgresMajorVersion: "16"
    databaseName: onedime
    user: onedime
    plan: free

